<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="공시업무 자동화 시스템 – 결재함. AI 검증 로그 확인 및 공시 문서 승인/반려 처리 화면." />
  <title>결재함 – Disclosure AI</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>

<div class="app-shell">
  <!-- 사이드바 -->
  <aside id="sidebar" class="sidebar"></aside>

  <!-- 메인 콘텐츠 -->
  <div class="main-content">

    <!-- 상단 헤더 -->
    <header id="page-header" class="page-header"></header>

    <!-- 분할 레이아웃 -->
    <div class="split-layout page-content-wide">

      <!-- 좌측: DART/KIND 동적 공시 초안 뷰어 (Step 2 연동 뷰어) -->
      <section class="split-panel flex-1" aria-label="공시 문서 미리보기" id="approval-doc-panel">
        <!-- 1번 영역 타이포그래피 깔끔 정돈 헤더 -->
        <div class="split-panel-header" id="approval-doc-header" style="background:#fff;border-bottom:1px solid var(--color-border);padding:var(--space-5) var(--space-6);display:block;">
          <div id="approval-header-content">
            <!-- JS로 깔끔하게 위아래 세로 배치 동적 렌더링 -->
          </div>
        </div>

        <!-- 문서 미리보기 본문 (100% 동적 렌더링) -->
        <div class="split-panel-body" style="padding:var(--space-5);background:#f8fafc;">
          <div class="doc-preview-body" id="approval-doc-preview" style="background:#fff;border-radius:12px;box-shadow:var(--shadow-sm);border:1px solid var(--color-border);">
            <!-- 동적 DART/KIND 서식 표가 실시간 동적 렌더링됩니다 -->
          </div>
        </div>
      </section>

      <!-- 2번 영역 우측: 승인 조치 & AI 검증 로그 (가운데 정렬 Center Layout) -->
      <section class="split-panel" aria-label="승인 조치 및 AI 검증 로그" style="width:400px;">
        <div class="split-panel-header" style="text-align:center;">
          <h2 class="split-panel-title" style="font-size:1.15rem;font-weight:700;margin:0 auto;">승인 조치 및 다운로드</h2>
        </div>
        <div class="split-panel-body">
          <div class="approval-panel" style="display:flex;flex-direction:column;align-items:center;text-align:center;">

            <!-- 초안 다운로드 버튼 (.dsd 바이너리 파일 다운로드) -->
            <button class="btn btn-secondary btn-full" id="btn-download-dsd" type="button" style="margin-bottom: var(--space-3);width:100%;max-width:320px;" onclick="downloadDsdDraft()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              완성 초안 다운로드 (.dsd)
            </button>

            <!-- 승인 버튼 (Step 4 제출로 이동 - onclick 직접 연결) -->
            <button class="btn btn-primary btn-full btn-lg" id="btn-approve" type="button" style="margin-bottom: var(--space-3);width:100%;max-width:320px;" onclick="handleApprove()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
              인증서 서명 및 승인
            </button>

            <!-- 2번: 내용 수정 하기 버튼 (Step 2 워크스페이스 이동 - onclick 직접 연결) -->
            <button class="btn btn-secondary btn-full" id="btn-edit-disclosure" type="button" style="margin-bottom: var(--space-5);width:100%;max-width:320px;" onclick="handleEditDisclosure()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              내용 수정 하기
            </button>


            <!-- 3번 영역: 탭 (AI 검증 로그 / 처리 이력 - 실제 데이터 연동) -->
            <div style="width:100%;">
              <div class="tab-list" role="tablist" aria-label="결재 정보 탭" style="justify-content:center;margin-bottom:var(--space-3);">
                <button
                  class="tab-item active"
                  role="tab"
                  data-tab="ai-log"
                  aria-selected="true"
                  id="tab-ai-log"
                  aria-controls="content-ai-log"
                >AI 검증 로그</button>
                <button
                  class="tab-item"
                  role="tab"
                  data-tab="history"
                  aria-selected="false"
                  id="tab-history"
                  aria-controls="content-history"
                >처리 이력</button>
              </div>

              <!-- AI 검증 로그 탭 콘텐츠 (실제 데이터 렌더링) -->
              <div
                class="tab-content active"
                data-tab-content="ai-log"
                id="content-ai-log"
                role="tabpanel"
                aria-labelledby="tab-ai-log"
              >
                <div style="padding: var(--space-2) 0;text-align:left;">
                  <div id="ai-log-container" class="ai-log-list" role="log" aria-live="polite"></div>
                </div>
              </div>

              <!-- 이력 탭 콘텐츠 (실제 이력 렌더링) -->
              <div
                class="tab-content"
                data-tab-content="history"
                id="content-history"
                role="tabpanel"
                aria-labelledby="tab-history"
              >
                <div style="padding: var(--space-2) 0;text-align:left;" id="history-container"></div>
              </div>

            </div><!-- /.tab-list + contents -->
          </div><!-- /.approval-panel -->
        </div><!-- /.split-panel-body -->
      </section>



    </div><!-- /.split-layout -->
  </div><!-- /.main-content -->
</div><!-- /.app-shell -->

<script src="js/api-client.js"></script>
<script src="js/app.js"></script>
<script src="js/approval.js"></script>
</body>
</html>
