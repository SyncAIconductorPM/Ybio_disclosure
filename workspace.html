<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="공시업무 자동화 시스템 – Human-in-the-loop 워크스페이스. AI 인사이트와 DART/KIND 에디터를 통해 공시 초안을 검토합니다." />
  <title>워크스페이스 – Disclosure AI</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>

<div class="app-shell">
  <!-- 사이드바 -->
  <aside id="sidebar" class="sidebar"></aside>

  <!-- 메인 콘텐츠 -->
  <div class="main-content">

    <!-- 상단 헤더 -->
    <header id="page-header" class="page-header"></header>

    <!-- 진행 스텝바 -->
    <div class="step-bar">
      <span class="step-bar-title">DART/KIND Filing: KRW 3B Investment</span>
      <div class="step-bar-divider"></div>
      <div class="steps" role="navigation" aria-label="진행 단계">
        <div class="step-item done">
          <span class="step-number">✓</span>
          업로드
        </div>
        <div class="step-connector"></div>
        <div class="step-item active">
          <span class="step-number">2</span>
          검증
        </div>
        <div class="step-connector"></div>
        <div class="step-item">
          <span class="step-number">3</span>
          검토
        </div>
      </div>
    </div>

    <!-- 분할 레이아웃 -->
    <div class="split-layout page-content-wide">

      <!-- 좌측: AI 인사이트 & 검증 패널 -->
      <section class="split-panel" aria-label="AI 인사이트 및 검증">
        <div class="split-panel-header">
          <div>
            <h2 class="split-panel-title">AI 인사이트 및 검증</h2>
            <p class="split-panel-sub">실시간 처리 로그</p>
          </div>
          <div class="system-active-badge">
            <div class="system-active-dot"></div>
            시스템 활성
          </div>
        </div>
        <div class="split-panel-body">
          <!-- AI 로그 목록 (JS로 렌더링) -->
          <div class="ai-log-list" id="ai-log-list" role="log" aria-live="polite" aria-label="AI 처리 로그"></div>
        </div>
      </section>

      <!-- 우측: DART/KIND 에디터 -->
      <section class="split-panel" aria-label="DART/KIND 에디터">
        <div class="split-panel-header">
          <div>
            <h2 class="split-panel-title">DART/KIND 에디터</h2>
            <p class="split-panel-sub">초안 미리보기 - 주요사항보고서(8-K) 대응</p>
          </div>
          <div class="flex gap-3">
            <button class="btn btn-secondary btn-sm" id="btn-temp-save" type="button">임시 저장</button>
            <button class="btn btn-primary btn-sm" id="btn-approval-request" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                <polyline points="9 11 12 14 22 4"/>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
              </svg>
              승인 요청
            </button>
          </div>
        </div>
        <div class="split-panel-body">

          <!-- 공시 제목 섹션 -->
          <div class="editor-section">
            <h3 class="editor-section-title">주요사항 보고서</h3>
            <p style="font-size:var(--font-size-xs);color:var(--color-text-secondary);margin-bottom:var(--space-4)">
              Submitted to the Financial Supervisory Service (FSS)
            </p>

            <div class="form-group" style="margin-bottom:var(--space-4)">
              <label class="form-label required" for="field-template">공시 서식 (템플릿 선택)</label>
              <input
                type="text"
                id="field-template"
                class="form-input"
                list="template-options"
                placeholder="공시 서식명을 검색하거나 선택하세요"
                aria-required="true"
              />
              <datalist id="template-options"></datalist>
            </div>

            <div class="form-group" style="margin-bottom:var(--space-4)">
              <label class="form-label required" for="field-title">공시 제목</label>
              <input
                type="text"
                id="field-title"
                class="form-input"
                placeholder="공시 제목을 입력하세요"
                aria-required="true"
              />
            </div>


            <div class="editor-form-grid">
              <div class="form-group">
                <label class="form-label required" for="field-board-date">이사회 결의일</label>
                <div class="input-with-icon">
                  <input
                    type="text"
                    id="field-board-date"
                    class="form-input"
                    placeholder="YYYY-MM-DD"
                    aria-required="true"
                    aria-describedby="board-date-hint"
                  />
                  <span class="input-icon-right">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                  </span>
                </div>
                <span class="form-hint" id="board-date-hint">형식: YYYY-MM-DD</span>
              </div>

              <div class="form-group">
                <label class="form-label required" for="field-complete-date">완료 예정일</label>
                <div class="input-with-icon">
                  <input
                    type="text"
                    id="field-complete-date"
                    class="form-input"
                    placeholder="YYYY-MM-DD"
                    aria-required="true"
                  />
                  <span class="input-icon-right">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                  </span>
                </div>
              </div>
            </div>
          </div>

          <!-- 거래 상세 내역 섹션 -->
          <div class="editor-section">
            <h3 class="editor-section-title">거래 상세 내역</h3>
            <table class="data-table" aria-label="거래 상세 내역">
              <thead>
                <tr>
                  <th scope="col">ITEM</th>
                  <th scope="col">VALUE / DESCRIPTION</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>거래 총액 (KRW)</td>
                  <td>
                    <input
                      type="text"
                      id="field-amount"
                      class="form-input"
                      style="border:none;padding:0;font-size:inherit;background:transparent;width:100%"
                      placeholder="0"
                      aria-label="거래 총액 (KRW)"
                      aria-required="true"
                    />
                  </td>
                </tr>
                <tr>
                  <td>상대방</td>
                  <td>
                    <input
                      type="text"
                      id="field-counterparty"
                      class="form-input"
                      style="border:none;padding:0;font-size:inherit;background:transparent;width:100%"
                      placeholder="상대방 회사명"
                      aria-label="상대방"
                      aria-required="true"
                    />
                  </td>
                </tr>
                <tr>
                  <td>자산 유형</td>
                  <td>
                    <input
                      type="text"
                      id="field-asset-type"
                      class="form-input"
                      style="border:none;padding:0;font-size:inherit;background:transparent;width:100%"
                      placeholder="자산 유형"
                      aria-label="자산 유형"
                      aria-required="true"
                    />
                  </td>
                </tr>
                <tr>
                  <td>자산 총액 대비 비율</td>
                  <td>
                    <input
                      type="text"
                      id="field-ratio"
                      class="form-input"
                      style="border:none;padding:0;font-size:inherit;background:transparent;width:100%"
                      placeholder="0.0%"
                      aria-label="자산 총액 대비 비율"
                    />
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- 취득 목적 섹션 -->
          <div class="editor-section">
            <h3 class="editor-section-title">취득 목적</h3>
            <div class="form-group">
              <textarea
                id="field-purpose"
                class="form-textarea"
                rows="4"
                placeholder="취득 목적을 상세히 기술하세요."
                aria-label="취득 목적"
                aria-required="true"
              ></textarea>
            </div>
          </div>

        </div><!-- /.split-panel-body -->
      </section>

    </div><!-- /.split-layout -->
  </div><!-- /.main-content -->
</div><!-- /.app-shell -->

<script src="js/api-client.js"></script>
<script src="js/app.js"></script>
<script src="js/workspace.js"></script>
</body>
</html>
