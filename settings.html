<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>설정 – Disclosure AI</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    .placeholder-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      color: var(--color-text-light);
      text-align: center;
    }
    .placeholder-content svg {
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
      stroke: var(--color-text-light);
      opacity: 0.5;
    }
    .placeholder-content h2 {
      color: var(--color-text);
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
<div class="app-shell">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content">
    <header id="page-header" class="page-header"></header>
    <div class="page-content" style="padding: 2rem;">
      <div class="card placeholder-content">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 1.42 13.6M4.93 4.93A10 10 0 0 0 3.51 18.53"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <h2>환경 설정</h2>
        <p>알림 설정, 계정 관리 및 시스템 연동 기능은 현재 개발 중입니다.</p>
      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    window.DisclosureApp?.ui.renderSidebar('settings.html');
    window.DisclosureApp?.ui.renderHeader('설정');
  });
</script>
</body>
</html>
