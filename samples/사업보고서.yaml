investor_protection_matters:
  # 1. 자산유동화계획 참여기관의 주요업무 및 담당자 등: 업무수탁자, 주관사, 법률고문 등 정보
  participating_organizations_and_personnel: "업무수탁자: ㈜국민은행 (담당자: 이영희 과장, 연락처: 02-111-2222), 주관사: 미래에셋증권"
  # 2. 기타: 소송, 우발채무 등 투자자 보호에 영향을 미치는 기타 사항
  others: "보고서 제출일 현재 당사가 피소되거나 제소한 중대한 소송사건은 존재하지 않음."
  # 3. 부속명세서: 감사보고서, 정관 등 부속 서류 목록
