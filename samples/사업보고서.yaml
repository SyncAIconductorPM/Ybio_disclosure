# III. 자산유동화계획의 추진실적
securitization_plan_performance:
  # 1. 자산유동화계획의 개요: 최초 유동화계획 및 변경 내역
  securitization_plan_overview: "2022년 5월 1일 금융위원회에 등록된 자산유동화계획에 따라 총 1,000억원의 유동화사채를 발행하였음."
  
  # 2. 유동화자산에 관한 사항
  securitized_assets:
    # 1) 유동화자산의 현황 (첨부파일로 제출 시 파일명 기재 가능, 개인정보 삭제 유의)
    status_of_securitized_assets: "상세 내역은 첨부된 '유동화자산명세(공시용)' 파일 참조."
    # 2) 유동화자산의 변동내역 및 분석내용: 조기상환, 연체, 부실 등 자산 상태 변화
    changes_and_analysis_of_assets: "당기 중 50억원의 원금이 정상적으로 조기 상환되었으며, 현재 전체 자산의 연체율은 0.1% 미만으로 안정적임."
    # 3) 유동화자산과 관련된 기타 필요한 사항 (부동산PF 진행현황 등 포함)
    other_necessary_matters_and_pf_progress: "부동산PF 사업장 1곳의 공정률은 85%로 당초 계획 대비 정상 진행 중이며 우발채무 발생 징후 없음."
  
  # 3. 유동화증권에 관한 사항
  securitized_securities:
    # 1) 유동화증권의 현황: 발행된 유동화증권의 종류, 발행금액, 만기 등
    status_of_securitized_securities: "선순위 유동화사채 900억원(만기 2025년 5월, 표면금리 4.5%), 후순위 100억원 발행 완료."
    # 2) 유동화증권의 향후 상환계획 및 방법
    redemption_plan_and_method: "기초자산에서 매월 발생하는 원리금 회수대금을 바탕으로 만기일에 일시 상환할 예정임."
    # 3) 자금의 차입ㆍ운용에 대한 계획 및 실적
    borrowing_and_operating_funds: "당기 중 신용공여기관으로부터 추가 외부 차입은 없었으며, 현재 유휴자금 10억원은 MMDA 계좌에 운용 중임."

